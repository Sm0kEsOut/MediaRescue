name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg and FFprobe
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe not found' }
          $dir = $ffmpeg.DirectoryName
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run tests
        run: python -m unittest discover -s tests -v
